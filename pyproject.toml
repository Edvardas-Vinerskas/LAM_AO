[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["vZWFS"]   # only your importable code; scripts are run directly

[project]
name = "lam-ao"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "oopao==1.0.0",
  "torch>=2.5", "gymnasium>=1.0", "pymatreader", "maoppy", "aopera",
  "pillow", "PyYAML", "imageio",
]

[tool.uv.sources]
torch = { index = "pytorch-cu121" }

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true